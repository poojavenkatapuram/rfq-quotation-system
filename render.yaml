services:
  - type: web
    name: forgeflow-api
    runtime: node
    rootDir: server
    region: singapore
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci && npx prisma generate && npm run build
    # Render Free does not support pre-deploy commands. This runs only the
    # checked-in additive Prisma migrations against the configured DATABASE_URL.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health/database
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: RFQ_DOCUMENT_STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: LOCAL_AI_ENABLED
        value: "false"

  - type: web
    name: forgeflow-frontend
    runtime: static
    autoDeployTrigger: off
    buildCommand: npm ci --prefix client && npm run build --prefix client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
